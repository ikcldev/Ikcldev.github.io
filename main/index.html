<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>App - Listamizar</title>
<meta name="description" content="Listamizar: monte sua lista de compras e descubra a melhor combinação que cabe no orçamento." />
<style>* { box-sizing: border-box; }

:root {
  --fundo: #f3f4f2;
  --cartao: #ffffff;
  --texto: #1d211f;
  --suave: #5f6762;
  --borda: #dfe3de;
  --verde: #1b7f46;
  --verde-escuro: #156438;
  --verde-claro: #e7f4ec;
  --perigo: #d32f2f;
  --roxo: #5b3cc4;
  --roxo-claro: #f4f1ff;
  font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  color: var(--texto);
  background: var(--fundo);
  -webkit-tap-highlight-color: transparent;
}

html, body { margin: 0; height: 100%; overflow: hidden; }
#root { height: 100%; }
button, input { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; }
input { font-size: 16px; }
:focus-visible { outline: 3px solid var(--verde); outline-offset: 2px; }

/* ---------- Estrutura ---------- */

.app {
  height: 100dvh;
  display: flex;
  flex-direction: column;
  max-width: 600px;
  margin: 0 auto;
  background: var(--fundo);
  overflow: hidden;
}
.app.paisagem { max-width: 1400px; }

.topo {
  flex: none;
  display: flex;
  align-items: center;
  gap: 4px;
  min-height: 56px;
  padding: 4px 8px;
  background: var(--cartao);
  border-bottom: 1px solid var(--borda);
}
.seletor-lista {
  display: flex;
  align-items: center;
  gap: 6px;
  min-height: 48px;
  min-width: 0;
  padding: 0 10px;
  font-size: 1.15rem;
  font-weight: 700;
  border-radius: 12px;
}
.seletor-lista:hover { background: var(--fundo); }
.seletor-nome { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.topo-etapa { margin-left: auto; padding-right: 6px; font-size: 0.8rem; color: var(--suave); white-space: nowrap; }

.painel { flex: 1; min-height: 0; display: flex; flex-direction: column; position: relative; }
.rolagem { flex: 1; min-height: 0; overflow-y: auto; overflow-x: hidden; padding: 12px 12px 20px; overscroll-behavior: contain; }

.duas-colunas {
  flex: 1;
  min-height: 0;
  display: grid;
  grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr);
}
.duas-colunas .painel-planejar { border-right: 1px solid var(--borda); }

.barra-base {
  flex: none;
  position: relative;
  padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
  background: var(--cartao);
  border-top: 1px solid var(--borda);
  box-shadow: 0 -4px 16px rgba(0, 0, 0, 0.05);
}

/* ---------- Controles ---------- */

.prioridade {
  flex: 1 1 auto;
  min-width: 0;
  min-height: 48px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 0 12px;
  border-radius: 12px;
  background: var(--cor);
  color: #111;
  font-weight: 700;
  font-size: 0.95rem;
  transition: background 0.15s, transform 0.08s;
  user-select: none;
}
.prioridade:active { transform: scale(0.97); }
.prioridade-rotulo { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.pips { display: inline-flex; gap: 3px; flex: none; }
.pips i { width: 7px; height: 7px; border-radius: 50%; background: rgba(0, 0, 0, 0.18); }
.pips i.on { background: #111; }

.chip {
  align-self: flex-start;
  display: inline-block;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--cor);
  color: #111;
  font-size: 0.7rem;
  font-weight: 700;
}

.campo-valor {
  flex: 0 0 128px;
  display: flex;
  align-items: center;
  gap: 4px;
  min-height: 48px;
  padding: 0 10px;
  background: #fff;
  border: 1px solid var(--borda);
  border-radius: 12px;
  cursor: text;
}
.campo-valor:focus-within { outline: 3px solid var(--verde); outline-offset: -1px; }
.campo-valor input { flex: 1; min-width: 0; width: 100%; border: 0; outline: none; background: transparent; text-align: right; }
.campo-valor input::placeholder { color: #9aa19c; }
.prefixo { color: var(--suave); font-size: 0.85rem; }

.botao-icone {
  flex: none;
  min-width: 48px;
  min-height: 48px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 12px;
  font-size: 1.25rem;
  color: var(--suave);
}
.botao-icone:hover { background: var(--fundo); }
.botao-icone.perigo { color: #fff; background: var(--perigo); font-size: 0.85rem; font-weight: 700; padding: 0 10px; }

.botao-principal, .botao-secundario {
  width: 100%;
  min-height: 52px;
  margin-top: 10px;
  border-radius: 14px;
  font-size: 1.05rem;
  font-weight: 700;
}
.botao-principal { background: var(--verde); color: #fff; }
.botao-principal:active { background: var(--verde-escuro); }
.botao-secundario { margin-top: 0; background: #fff; border: 1px solid var(--borda); }
.botao-texto { margin-top: 6px; min-height: 44px; padding: 0 4px; color: var(--verde); font-weight: 600; }

/* ---------- Planejamento ---------- */

.novo-item {
  display: grid;
  gap: 8px;
  padding: 10px;
  margin-bottom: 14px;
  background: var(--cartao);
  border: 2px dashed #c4d9cb;
  border-radius: 16px;
}
.novo-nome {
  min-height: 48px;
  padding: 0 12px;
  border: 1px solid var(--borda);
  border-radius: 12px;
  outline: none;
  width: 100%;
}
.novo-nome:focus { outline: 3px solid var(--verde); outline-offset: -1px; }
.linha-controles { display: flex; gap: 8px; align-items: center; min-width: 0; }
.botao-mais {
  flex: none;
  width: 48px;
  height: 48px;
  border-radius: 12px;
  background: var(--verde);
  color: #fff;
  font-size: 1.8rem;
  line-height: 1;
}

.cartoes { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; container-type: inline-size; }

.deslizante { position: relative; border-radius: 16px; }
.fundo-apagar {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: flex-end;
  padding-right: 22px;
  border-radius: 16px;
  background: var(--perigo);
  color: #fff;
  font-weight: 700;
}
.cartao {
  position: relative;
  background: var(--cartao);
  border: 1px solid var(--borda);
  border-radius: 16px;
  padding: 8px 10px 10px;
  touch-action: pan-y;
  transition: transform 0.18s ease-out;
}
.cartao.arrastando { transition: none; }

.cartao-item { display: grid; gap: 6px; min-width: 0; }
.item-nome {
  width: 100%;
  min-height: 44px;
  padding: 0 6px;
  border: 1px solid transparent;
  border-radius: 10px;
  background: transparent;
  font-weight: 600;
  outline: none;
  text-overflow: ellipsis;
}
.item-nome:focus { border-color: var(--borda); background: #fafbfa; }
.deslizante.sem-preco .campo-valor { border-style: dashed; border-color: #d7b44a; background: #fffbea; }
.tag-sem-preco { padding: 2px 8px; border-radius: 999px; background: #fff3cd; color: #7a5a00; font-size: 0.72rem; font-weight: 600; }

@container (min-width: 520px) {
  .cartao-item { grid-template-columns: minmax(0, 1fr) auto; align-items: center; }
  .cartao-item .linha-controles { width: 330px; }
  .tags { grid-column: 1 / -1; margin-left: 6px; }
}

/* Botão de apagar: visível só com mouse; no toque, gesto de deslizar (e leitor de tela) */
.apagar-mouse {
  position: absolute;
  width: 1px;
  height: 1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
}
.apagar-mouse:focus-visible { width: auto; height: auto; clip: auto; top: 4px; right: 4px; padding: 6px 10px; background: var(--perigo); color: #fff; border-radius: 10px; }
@media (hover: hover) and (pointer: fine) {
  .cartao-item { padding-right: 40px; }
  .apagar-mouse {
    width: 36px;
    height: 36px;
    clip: auto;
    top: 8px;
    right: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 10px;
    color: #9aa19c;
    font-size: 1.3rem;
  }
  .apagar-mouse:hover { background: #fdecec; color: var(--perigo); }
  .dica-gesto { display: none; }
}

.dica-gesto { margin: 12px 4px 0; font-size: 0.78rem; color: var(--suave); text-align: center; }
.vazio { padding: 28px 12px; text-align: center; color: var(--suave); }

.linha-orcamento { display: flex; align-items: center; gap: 10px; }
.rotulo-orcamento { font-weight: 700; }
.campo-orcamento { flex: 1; }
.campo-orcamento input { font-size: 1.25rem; font-weight: 700; }
.aviso { margin: 8px 0 0; padding: 6px 10px; border-radius: 10px; background: #fff3cd; color: #6b4e00; font-size: 0.85rem; }

.aviso-desfazer {
  position: absolute;
  left: 12px;
  right: 12px;
  bottom: calc(100% + 10px);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  padding: 6px 6px 6px 14px;
  border-radius: 12px;
  background: #23272a;
  color: #fff;
  box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
  animation: subir 0.18s ease-out;
}
.aviso-desfazer span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.aviso-desfazer button { flex: none; min-height: 44px; padding: 0 12px; color: #8fe3b4; font-weight: 700; }
@keyframes subir { from { transform: translateY(8px); opacity: 0; } }

/* ---------- Resultado ---------- */

.resumo {
  padding: 14px;
  background: var(--cartao);
  border: 1px solid var(--borda);
  border-radius: 18px;
}
.resumo-topo { display: flex; justify-content: space-between; align-items: flex-end; gap: 8px; }
.resumo-rotulo { display: block; font-size: 0.8rem; color: var(--suave); }
.resumo-total { display: block; font-size: 1.9rem; line-height: 1.15; }
.resumo-de { font-size: 0.85rem; color: var(--suave); }
.resumo-pct { font-size: 1.1rem; font-weight: 700; color: var(--verde); }
.barra-progresso { height: 10px; margin: 12px 0; border-radius: 999px; background: #e9ece8; overflow: hidden; }
.barra-progresso { display: flex; }
.barra-progresso > div { height: 100%; transition: width 0.3s; }
.parte-reservada { background: var(--roxo); }
.parte-otimizada { background: var(--verde); }
.estourou .parte-reservada { background: var(--perigo); }
.resumo-numeros { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.resumo-numeros div { padding: 8px; border-radius: 12px; background: var(--fundo); min-width: 0; }
.resumo-numeros span { display: block; font-size: 0.75rem; color: var(--suave); }
.resumo-numeros strong { font-size: 1rem; white-space: nowrap; }
.nota { margin: 10px 0 0; font-size: 0.8rem; color: var(--suave); }

.secao { margin-top: 18px; }
.secao-cabeca { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin: 0 4px 8px; }
.secao-cabeca h2 { margin: 0; font-size: 1rem; }
.contador { font-size: 0.8rem; color: var(--suave); }
.vazio-secao { margin: 0; padding: 16px; border-radius: 14px; background: var(--cartao); color: var(--suave); text-align: center; }

.cartao-levar {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  padding: 0;
  background: var(--verde-claro);
  border-color: #c9e5d4;
}
.levar-marcar {
  display: grid;
  grid-template-columns: 32px minmax(0, 1fr) auto;
  align-items: center;
  gap: 10px;
  min-height: 60px;
  padding: 8px 4px 8px 12px;
  cursor: pointer;
  user-select: none;
}
.cartao-levar input { position: absolute; opacity: 0; width: 1px; height: 1px; }
.caixa {
  width: 30px;
  height: 30px;
  border: 2px solid var(--verde);
  border-radius: 9px;
  background: #fff;
  display: flex;
  align-items: center;
  justify-content: center;
}
.cartao-levar input:focus-visible + .caixa { outline: 3px solid var(--verde); outline-offset: 2px; }
.marcado .caixa { background: var(--verde); }
.marcado .caixa::after { content: '✓'; color: #fff; font-weight: 800; font-size: 1.1rem; }
.cartao-levar.marcado { background: #f3faf6; }
.marcado .levar-nome { color: var(--suave); }

.levar-texto { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.levar-nome { font-weight: 600; overflow-wrap: anywhere; }
.levar-preco { font-weight: 700; white-space: nowrap; }

.cartao-depois {
  display: grid;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: center;
  gap: 4px 10px;
  padding: 10px 14px;
  background: #f7f8f6;
  border-style: dashed;
}
.cartao-depois .levar-nome, .cartao-depois .levar-preco { color: var(--suave); font-weight: 500; }
.cartao-depois .chip { opacity: 0.75; }
.dica-falta { grid-column: 1 / -1; font-size: 0.8rem; color: #545b56; }

/* ---------- Seletor de listas (folha) ---------- */

.fundo-folha {
  position: fixed;
  inset: 0;
  z-index: 50;
  display: flex;
  align-items: flex-end;
  justify-content: center;
  background: rgba(0, 0, 0, 0.38);
  animation: aparecer 0.15s ease-out;
}
.folha {
  width: 100%;
  max-width: 600px;
  max-height: 88dvh;
  overflow-y: auto;
  padding: 6px 16px calc(16px + env(safe-area-inset-bottom));
  background: var(--cartao);
  border-radius: 20px 20px 0 0;
  outline: none;
  animation: subir 0.2s ease-out;
}
.paisagem .fundo-folha { align-items: center; }
.paisagem .folha { border-radius: 20px; max-height: 92dvh; }
@keyframes aparecer { from { opacity: 0; } }
.folha-alca { width: 40px; height: 4px; margin: 4px auto 6px; border-radius: 999px; background: #d3d7d2; }
.folha-cabeca { display: flex; align-items: center; justify-content: space-between; }
.folha h2 { margin: 0; font-size: 1.1rem; }
.folha h3 { margin: 18px 0 8px; font-size: 0.9rem; color: var(--suave); font-weight: 600; }

.folha-listas { list-style: none; margin: 4px 0 0; padding: 0; }
.folha-listas li { display: flex; align-items: center; gap: 2px; border-bottom: 1px solid var(--borda); }
.folha-lista { flex: 1; min-width: 0; min-height: 60px; display: flex; align-items: center; gap: 12px; text-align: left; padding: 0 4px; border-radius: 12px; }
.folha-lista strong, .modelo strong { display: block; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.folha-lista small, .modelo small { color: var(--suave); }
.folha-lista > span:last-child { min-width: 0; }
.marca { color: var(--verde); font-size: 1.1rem; }
.renomear { flex: 1; padding: 6px 0; }
.renomear input, .nova-lista input { width: 100%; min-height: 48px; padding: 0 12px; border: 1px solid var(--borda); border-radius: 12px; }

.nova-lista { display: flex; gap: 8px; margin-top: 14px; }
.nova-lista input { flex: 1; min-width: 0; }
.nova-lista button { min-height: 48px; padding: 0 18px; border-radius: 12px; background: var(--verde); color: #fff; font-weight: 700; }

.modelos { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
.modelo { min-height: 60px; padding: 8px 12px; text-align: left; border: 1px solid var(--borda); border-radius: 12px; min-width: 0; }
.modelo:hover { background: var(--fundo); }

.status { margin: 16px 0 0; font-size: 0.78rem; color: var(--suave); }
.status-conta { color: var(--verde); }
.status-erro { color: var(--perigo); }

/* Celular deitado: telas baixas */
@media (orientation: landscape) and (max-height: 500px) {
  .topo { min-height: 48px; padding: 0 8px; }
  .barra-base { padding-top: 8px; padding-bottom: calc(8px + env(safe-area-inset-bottom)); }
  .rolagem { padding-top: 8px; }
  .resumo { padding: 10px 12px; }
  .resumo-total { font-size: 1.5rem; }
  /* cartões em uma linha só para caber mais itens na tela */
  .novo-item { grid-template-columns: minmax(0, 1fr) 280px; align-items: center; padding: 8px; margin-bottom: 10px; }
  .cartao { padding: 6px 8px; }
  .cartao-item { grid-template-columns: minmax(0, 1fr) 232px; align-items: center; }
  .cartao-item .linha-controles { width: auto; }
  .tags { grid-column: 1 / -1; margin-left: 6px; }
  .pips { display: none; }
  .prioridade { padding: 0 10px; }
  .campo-valor { flex-basis: 104px; }
  .cartoes { gap: 6px; }
  .novo-item .prefixo { display: none; }
}

/* ---------- Obrigatórios e "e se?" ---------- */

.linha-nome { display: flex; align-items: center; gap: 4px; min-width: 0; }
.linha-nome .item-nome { flex: 1; min-width: 0; }
.pino {
  flex: none;
  width: 48px;
  height: 48px;
  display: inline-flex;
  align-items: center;
  justify-content: center;
  border-radius: 12px;
  color: #8a918c;
}
.pino:hover { background: var(--fundo); }
.pino.ativo { background: var(--roxo); color: #fff; }
.deslizante.obrigatorio .cartao { border: 2px solid var(--roxo); background: var(--roxo-claro); }
.deslizante.excluido .cartao { border-style: dashed; background: #f4f5f3; }
.deslizante.excluido .item-nome { color: var(--suave); }

.tags { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
.selo-obrigatorio {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  padding: 2px 8px;
  border-radius: 999px;
  background: var(--roxo);
  color: #fff;
  font-size: 0.7rem;
  font-weight: 700;
}
.tag-excluido { min-height: 40px; padding: 0 12px; border-radius: 999px; background: #e6e9e5; font-size: 0.78rem; font-weight: 600; }

.alerta-estouro {
  margin: 8px 0 0;
  padding: 8px 10px;
  border-radius: 10px;
  border: 1px solid #f3c1bc;
  background: #fdecea;
  color: #8c1d18;
  font-size: 0.85rem;
  line-height: 1.35;
}
.linha-reserva {
  display: flex;
  flex-wrap: wrap;
  justify-content: space-between;
  gap: 2px 10px;
  margin: 8px 0 0;
  padding: 6px 10px;
  border-radius: 10px;
  background: var(--roxo-claro);
  color: #3d2591;
  font-size: 0.82rem;
  font-weight: 600;
}

.ajuste-orcamento {
  position: sticky;
  top: -12px;
  z-index: 2;
  display: grid;
  grid-template-columns: auto minmax(0, 1fr) auto auto;
  gap: 6px;
  margin: -12px -12px 12px;
  padding: 10px 12px;
  background: var(--fundo);
  border-bottom: 1px solid var(--borda);
}
.passo {
  min-height: 48px;
  padding: 0 9px;
  border-radius: 12px;
  border: 1px solid var(--borda);
  background: #fff;
  font-size: 0.85rem;
  font-weight: 700;
  white-space: nowrap;
}
.passo:active { background: var(--verde-claro); }
.passo:disabled { opacity: 0.45; cursor: default; }
.campo-ajuste input { font-weight: 700; }

.mudanca {
  display: flex;
  align-items: flex-start;
  gap: 4px;
  margin-bottom: 12px;
  padding: 6px 2px 6px 12px;
  border-radius: 14px;
  border: 1px solid #c6d8f7;
  background: #eef4fe;
  color: #13325f;
  font-size: 0.88rem;
  line-height: 1.4;
  animation: subir 0.18s ease-out;
}
.mudanca p { flex: 1; margin: 8px 0; }

.legenda-barra { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 6px; margin: -4px 0 8px; font-size: 0.75rem; color: var(--suave); }
.legenda-barra i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-left: 4px; }
.legenda-barra i:first-child { margin-left: 0; }
.cor-reservada { background: var(--roxo); }
.cor-otimizada { background: var(--verde); }
.estourou .resumo-pct { color: var(--perigo); }

.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip-novo, .chip-saiu { padding: 2px 8px; border-radius: 999px; font-size: 0.7rem; font-weight: 700; }
.chip-novo { background: #1f62c4; color: #fff; }
.chip-saiu { background: #fbe0dd; color: #8c1d18; }
.cartao-levar.obrigatorio { border: 2px solid var(--roxo); }
.cartao-levar.novidade { box-shadow: 0 0 0 2px #1f62c4; }
.cartao-depois.saiu { border-color: #e2a59f; }

.botao-tirar {
  min-height: 48px;
  min-width: 56px;
  margin-right: 6px;
  padding: 0 10px;
  border-radius: 12px;
  color: var(--suave);
  font-size: 0.85rem;
  font-weight: 600;
}
.botao-tirar:hover { background: rgba(0, 0, 0, 0.05); color: var(--perigo); }
.botao-incluir {
  grid-column: 1 / -1;
  justify-self: start;
  min-height: 44px;
  margin-top: 4px;
  padding: 0 14px;
  border-radius: 12px;
  border: 1px solid var(--roxo);
  background: #fff;
  color: var(--roxo);
  font-weight: 600;
}
.botao-incluir:active { background: var(--roxo-claro); }

/* ---------- Marca ---------- */
.seletor-textos { display: flex; flex-direction: column; align-items: flex-start; min-width: 0; line-height: 1.15; }
.marca-app { font-size: 0.7rem; font-weight: 800; letter-spacing: 0.04em; text-transform: uppercase; color: var(--verde); }
</style>
